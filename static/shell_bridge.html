<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gps-stick shell bridge</title>
  </head>
  <body>
    <script>
      (function () {
        // Streamlit strips <script> from st.markdown, so this tiny iframe installs
        // listeners on the top Streamlit window instead.
        var topWin;
        try {
          topWin = window.top;
        } catch (error) {
          return;
        }
        if (!topWin) {
          return;
        }

        var topDoc = topWin.document;
        var FIT_VIEWPORT =
          "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
        // Bump when one-time shell listeners change.
        var SHELL_VERSION = 7;
        var alreadyInstalled = topWin.__gpsStickShellInstalled === SHELL_VERSION;
        topWin.__gpsStickShellInstalled = SHELL_VERSION;

        // Streamlit defaults to Auto/system when light+dark themes exist.
        // Seed "Light" when unset or System so the app opens white by default.
        // Respect an explicit user choice of Dark (or Light).
        (function ensureLightThemeDefault() {
          var migrateKey = "gpsStickLightThemeDefaultV2";
          try {
            if (topWin.localStorage.getItem(migrateKey) === "1") {
              return;
            }
            var themeKey =
              "stActiveTheme-" + topWin.location.pathname + "-v2";
            var raw = topWin.localStorage.getItem(themeKey);
            var selection = null;
            if (raw != null) {
              try {
                selection = JSON.parse(raw);
              } catch (error) {
                selection = null;
              }
            }
            if (selection && typeof selection === "object" && selection.name) {
              var name = String(selection.name);
              if (/dark/i.test(name) && !/auto|system/i.test(name)) {
                selection = "Dark";
              } else if (/light/i.test(name) && !/auto|system/i.test(name)) {
                selection = "Light";
              } else {
                selection = "System";
              }
            }
            var shouldForceLight =
              selection !== "Light" && selection !== "Dark";
            if (shouldForceLight) {
              topWin.localStorage.setItem(themeKey, JSON.stringify("Light"));
              topWin.localStorage.removeItem("stActiveTheme");
              topWin.localStorage.removeItem(
                "stActiveTheme-" + topWin.location.pathname
              );
            }
            topWin.localStorage.setItem(migrateKey, "1");
            if (shouldForceLight && !topWin.__gpsStickThemeReloading) {
              topWin.__gpsStickThemeReloading = true;
              topWin.location.reload();
            }
          } catch (error) {
            // localStorage may be unavailable.
          }
        })();
        if (topWin.__gpsStickThemeReloading) {
          return;
        }

        // Remove any leftover Fit page control from earlier builds.
        var staleFit = topDoc.getElementById("gps-stick-fit-page");
        if (staleFit && staleFit.parentNode) {
          staleFit.parentNode.removeChild(staleFit);
        }

        function ensureViewportMeta() {
          var meta = topDoc.querySelector('meta[name="viewport"]');
          if (!meta) {
            meta = topDoc.createElement("meta");
            meta.setAttribute("name", "viewport");
            if (topDoc.head) {
              topDoc.head.insertBefore(meta, topDoc.head.firstChild);
            }
          }
          return meta;
        }

        function resetPageZoom() {
          var meta = ensureViewportMeta();
          // Safari sometimes ignores a no-op content write; toggle to force apply.
          meta.setAttribute(
            "content",
            "width=device-width, initial-scale=1.0001, maximum-scale=1, user-scalable=no"
          );
          try {
            topWin.scrollTo(0, 0);
          } catch (error) {}
          setTimeout(function () {
            meta.setAttribute("content", FIT_VIEWPORT);
            try {
              topWin.scrollTo(0, 0);
            } catch (error) {}
          }, 30);
        }

        // Lock scale up front so focus-into-inputs cannot leave the page zoomed.
        ensureViewportMeta().setAttribute("content", FIT_VIEWPORT);

        if (!alreadyInstalled) {
          function sidebarEl() {
            return topDoc.querySelector('[data-testid="stSidebar"]');
          }

          function isSidebarExpanded() {
            var sidebar = sidebarEl();
            if (!sidebar) {
              return false;
            }
            var aria = sidebar.getAttribute("aria-expanded");
            if (aria === "false") {
              return false;
            }
            if (aria === "true") {
              return true;
            }
            var rect = sidebar.getBoundingClientRect();
            return rect.width > 40 && rect.left > -rect.width * 0.5;
          }

          function collapseSidebar() {
            if (!isSidebarExpanded()) {
              return;
            }
            var collapseRoot = topDoc.querySelector(
              '[data-testid="stSidebarCollapseButton"]'
            );
            var button =
              (collapseRoot && collapseRoot.querySelector("button")) ||
              collapseRoot;
            if (button && typeof button.click === "function") {
              button.click();
            }
          }

          topDoc.addEventListener(
            "mousedown",
            function (event) {
              var sidebar = sidebarEl();
              if (!sidebar || !isSidebarExpanded()) {
                return;
              }
              var target = event.target;
              if (!target || !(target instanceof topWin.Node)) {
                return;
              }
              if (sidebar.contains(target)) {
                return;
              }
              var collapseRoot = topDoc.querySelector(
                '[data-testid="stSidebarCollapseButton"]'
              );
              if (collapseRoot && collapseRoot.contains(target)) {
                return;
              }
              var collapsedCtl = topDoc.querySelector(
                '[data-testid="stSidebarCollapsedControl"]'
              );
              if (collapsedCtl && collapsedCtl.contains(target)) {
                return;
              }
              if (
                target.closest &&
                target.closest('iframe[data-gps-stick-fs-active="1"]')
              ) {
                return;
              }
              var main =
                topDoc.querySelector('[data-testid="stAppViewContainer"]') ||
                topDoc.querySelector('[data-testid="stMain"]') ||
                topDoc.querySelector("section.main");
              if (main && main.contains(target)) {
                collapseSidebar();
              }
            },
            true
          );

          // After leaving a text field, snap back to the unzoomed page.
          topDoc.addEventListener(
            "focusout",
            function (event) {
              var target = event.target;
              if (!target || !target.tagName) {
                return;
              }
              var tag = String(target.tagName).toLowerCase();
              if (
                tag === "input" ||
                tag === "textarea" ||
                tag === "select" ||
                (target.getAttribute &&
                  target.getAttribute("contenteditable") === "true")
              ) {
                setTimeout(resetPageZoom, 50);
              }
            },
            true
          );

          topWin.addEventListener("orientationchange", function () {
            setTimeout(resetPageZoom, 100);
          });
        }

        // --- Fullscreen iframe + Safari chrome (always rebind) ---
        var LIGHT_CHROME = "#ffffff";
        var DARK_CHROME = "#0e1117";

        function parseRgb(color) {
          if (!color) {
            return null;
          }
          var text = String(color).trim();
          var m = text.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
          if (m) {
            return [Number(m[1]), Number(m[2]), Number(m[3])];
          }
          m = text.match(/^#([0-9a-f]{6})$/i);
          if (m) {
            var n = parseInt(m[1], 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
          }
          m = text.match(/^#([0-9a-f]{3})$/i);
          if (m) {
            var h = m[1];
            return [
              parseInt(h.charAt(0) + h.charAt(0), 16),
              parseInt(h.charAt(1) + h.charAt(1), 16),
              parseInt(h.charAt(2) + h.charAt(2), 16),
            ];
          }
          return null;
        }

        function isDarkRgb(rgb) {
          if (!rgb) {
            return false;
          }
          var lum = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
          return lum < 128;
        }

        function readElementBackground(el) {
          if (!el || !topWin.getComputedStyle) {
            return "";
          }
          var styles = topWin.getComputedStyle(el);
          var fromVar = (
            styles.getPropertyValue("--background-color") ||
            styles.getPropertyValue("--st-background-color") ||
            ""
          ).trim();
          if (fromVar) {
            return fromVar;
          }
          var bg = styles.backgroundColor || "";
          if (bg && bg !== "transparent" && bg !== "rgba(0, 0, 0, 0)") {
            return bg;
          }
          return "";
        }

        function getStreamlitBackground() {
          var candidates = [
            topDoc.querySelector('[data-testid="stAppViewContainer"]'),
            topDoc.querySelector(".stApp"),
            topDoc.querySelector('section.main'),
            topDoc.body,
            topDoc.documentElement,
          ];
          for (var i = 0; i < candidates.length; i += 1) {
            var color = readElementBackground(candidates[i]);
            if (color) {
              return color;
            }
          }
          return LIGHT_CHROME;
        }

        function detectStreamlitDark() {
          // Prefer Streamlit's own theme cache over guessing from OS.
          try {
            var themeKey =
              "stActiveTheme-" + topWin.location.pathname + "-v2";
            var raw = topWin.localStorage.getItem(themeKey);
            if (raw != null) {
              var selection = JSON.parse(raw);
              if (selection === "Dark") {
                return true;
              }
              if (selection === "Light") {
                return false;
              }
            }
          } catch (error) {}
          return isDarkRgb(parseRgb(getStreamlitBackground()));
        }

        function siteChromeDefaults() {
          if (detectStreamlitDark()) {
            return {
              themeColor: DARK_CHROME,
              colorScheme: "dark",
              appleStatus: "black-translucent",
            };
          }
          return {
            themeColor: LIGHT_CHROME,
            colorScheme: "light",
            appleStatus: "default",
          };
        }

        function buildFullscreenStyle(background) {
          return [
            "position:fixed",
            "inset:0",
            "width:100vw",
            "height:100dvh",
            "max-width:none",
            "max-height:none",
            "z-index:2147483646",
            "border:none",
            "background:" + (background || LIGHT_CHROME),
            "margin:0",
            "padding:0",
            "display:block",
          ].join(";");
        }

        function findFrameIn(doc, childWin) {
          if (!doc) {
            return null;
          }
          var frames = doc.querySelectorAll("iframe");
          for (var i = 0; i < frames.length; i += 1) {
            try {
              if (frames[i].contentWindow === childWin) {
                return frames[i];
              }
            } catch (error) {
              // Cross-origin frame; skip.
            }
          }
          return null;
        }

        function collectAncestorFrames(sourceWin) {
          var chain = [];
          var win = sourceWin;
          while (win && win !== topWin) {
            var parentWin = win.parent;
            if (!parentWin) {
              break;
            }
            var frame = null;
            try {
              frame = findFrameIn(parentWin.document, win);
            } catch (error) {
              frame = null;
            }
            if (frame) {
              chain.push(frame);
            }
            win = parentWin;
          }
          return chain;
        }

        function replaceMeta(name, content) {
          // Safari often ignores in-place theme-color updates; recreate the tag.
          var existing = topDoc.querySelectorAll('meta[name="' + name + '"]');
          for (var i = 0; i < existing.length; i += 1) {
            if (existing[i].parentNode) {
              existing[i].parentNode.removeChild(existing[i]);
            }
          }
          var meta = topDoc.createElement("meta");
          meta.setAttribute("name", name);
          meta.setAttribute("content", content);
          if (topDoc.head) {
            topDoc.head.appendChild(meta);
          }
          return meta;
        }

        function captureChromeTheme() {
          var themeMeta = topDoc.querySelector('meta[name="theme-color"]');
          var schemeMeta = topDoc.querySelector('meta[name="color-scheme"]');
          var appleMeta = topDoc.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]'
          );
          topWin.__gpsStickSavedChrome = {
            themeColor: themeMeta ? themeMeta.getAttribute("content") : null,
            colorScheme: schemeMeta ? schemeMeta.getAttribute("content") : null,
            appleStatus: appleMeta ? appleMeta.getAttribute("content") : null,
            htmlColorScheme:
              (topDoc.documentElement &&
                topDoc.documentElement.style.colorScheme) ||
              "",
            bodyColorScheme:
              (topDoc.body && topDoc.body.style.colorScheme) || "",
          };
        }

        function setSiteSafariChrome(saved) {
          var defaults = siteChromeDefaults();
          var themeColor =
            (saved && saved.themeColor) || defaults.themeColor;
          var colorScheme =
            (saved && saved.colorScheme) || defaults.colorScheme;
          var appleStatus =
            (saved && saved.appleStatus) || defaults.appleStatus;

          // Only touch Safari chrome metas — don't override Streamlit's
          // document color-scheme (that fights the Settings theme picker).
          replaceMeta("theme-color", themeColor);
          replaceMeta("color-scheme", colorScheme);
          replaceMeta("apple-mobile-web-app-status-bar-style", appleStatus);

          setTimeout(function () {
            replaceMeta("theme-color", themeColor);
            replaceMeta("color-scheme", colorScheme);
          }, 50);
        }

        function applySafariChromeTheme(active) {
          if (active) {
            if (!topWin.__gpsStickSavedChrome) {
              captureChromeTheme();
            }
            var defaults = siteChromeDefaults();
            replaceMeta("theme-color", defaults.themeColor);
            replaceMeta("color-scheme", defaults.colorScheme);
            replaceMeta(
              "apple-mobile-web-app-status-bar-style",
              defaults.appleStatus
            );
            return;
          }

          setSiteSafariChrome(topWin.__gpsStickSavedChrome || null);
          topWin.__gpsStickSavedChrome = null;
        }

        function setFrameFullscreen(frame, active, background) {
          if (!frame) {
            return;
          }
          if (active) {
            if (frame.dataset.gpsStickFs == null) {
              frame.dataset.gpsStickFs = frame.getAttribute("style") || "";
            }
            frame.setAttribute("data-gps-stick-fs-active", "1");
            frame.style.cssText = buildFullscreenStyle(background);
          } else if (frame.getAttribute("data-gps-stick-fs-active") === "1") {
            frame.style.cssText = frame.dataset.gpsStickFs || "";
            delete frame.dataset.gpsStickFs;
            frame.removeAttribute("data-gps-stick-fs-active");
          }
        }

        function notifyNavFullscreenTheme(sourceWin, active, background, dark) {
          if (!sourceWin || typeof sourceWin.postMessage !== "function") {
            return;
          }
          try {
            sourceWin.postMessage(
              {
                type: "gps-stick-nav-fullscreen-theme",
                active: !!active,
                background: background || LIGHT_CHROME,
                dark: !!dark,
              },
              "*"
            );
          } catch (error) {
            // Source frame may be gone.
          }
        }

        if (topWin.__gpsStickNavFsHandler) {
          topWin.removeEventListener("message", topWin.__gpsStickNavFsHandler);
        }
        topWin.__gpsStickNavFsHandler = function (event) {
          var data = event.data;
          if (!data || data.type !== "gps-stick-nav-fullscreen") {
            return;
          }
          var active = !!data.active;
          var dark = detectStreamlitDark();
          var background = getStreamlitBackground();
          // Trust Light/Dark preference over a mis-read DOM color.
          if (dark && !isDarkRgb(parseRgb(background))) {
            background = DARK_CHROME;
          } else if (!dark && isDarkRgb(parseRgb(background))) {
            background = LIGHT_CHROME;
          }
          var chain = collectAncestorFrames(event.source);
          for (var i = 0; i < chain.length; i += 1) {
            setFrameFullscreen(chain[i], active, background);
          }
          applySafariChromeTheme(active);
          notifyNavFullscreenTheme(event.source, active, background, dark);
        };
        topWin.addEventListener("message", topWin.__gpsStickNavFsHandler);

        // Match Safari chrome to the active Streamlit theme (light by default).
        if (!topDoc.querySelector('iframe[data-gps-stick-fs-active="1"]')) {
          setSiteSafariChrome(null);
        }
      })();
    </script>
  </body>
</html>
