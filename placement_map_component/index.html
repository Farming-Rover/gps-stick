<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Served locally by Streamlit from this component's folder: no CDN
         round trips, so the map initializes as soon as the iframe loads. -->
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      .map-shell {
        position: relative;
        width: 100%;
        height: 520px;
      }

      .center-reticle {
        pointer-events: none;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 26px;
        height: 26px;
        margin-left: -13px;
        margin-top: -13px;
        z-index: 1000;
        border: 2px solid rgba(0, 200, 83, 0.95);
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
      }

      .center-reticle::before,
      .center-reticle::after {
        content: "";
        position: absolute;
        background: rgba(0, 200, 83, 0.95);
      }

      .center-reticle::before {
        left: 50%;
        top: 3px;
        width: 2px;
        height: 20px;
        margin-left: -1px;
      }

      .center-reticle::after {
        top: 50%;
        left: 3px;
        width: 20px;
        height: 2px;
        margin-top: -1px;
      }

      .map-hud {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }

      .origin-readout {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 6px;
        padding: 6px 10px;
        font: 12px/1.4 sans-serif;
        color: #222;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="map-shell" id="map-shell">
      <div id="map"></div>
      <div class="center-reticle" title="Grid origin (R1C1)"></div>
      <div class="map-hud">
        <div id="origin-readout" class="origin-readout"></div>
      </div>
    </div>

    <script src="vendor/leaflet.js"></script>
    <script src="vendor/leaflet-rotate.js"></script>
    <script>
      // Must match MAP_MESSAGE_TYPE in placement_map_html.py.
      const MAP_MESSAGE_TYPE = "gps-stick-map";

      // --- Streamlit custom component protocol (manual, no build step) ---
      function sendToStreamlit(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, data),
          "*"
        );
      }

      let map = null;
      let gridLayer = null;
      let userMarker = null;
      let suppressEvents = false;
      // Python bumps view_seq when it wants to force the view to the args
      // center (e.g. "Reset grid to current position"). Values reported back
      // carry the seq so stale positions can be ignored server-side.
      let lastViewSeq = null;

      const CONFIG = {
        dim_m: 4,
        dim_e: 4,
        spacing_m: 2.0,
        staggered: true,
        endless: false,
        user_lat: null,
        user_lon: null,
      };

      function asCount(value, fallback) {
        const parsed = Math.round(Number(value));
        if (!Number.isFinite(parsed) || parsed < 1) {
          return fallback;
        }
        return parsed;
      }

      function rowIsOdd(rowIndex) {
        return (((rowIndex % 2) + 2) % 2) === 1;
      }

      function destinationLatLng(lat, lon, bearingDeg, distanceM) {
        if (!distanceM) {
          return [lat, lon];
        }
        const earthRadius = 6371000;
        const bearing = (bearingDeg * Math.PI) / 180;
        const lat1 = (lat * Math.PI) / 180;
        const lon1 = (lon * Math.PI) / 180;
        const ang = distanceM / earthRadius;
        const lat2 = Math.asin(
          Math.sin(lat1) * Math.cos(ang) +
            Math.cos(lat1) * Math.sin(ang) * Math.cos(bearing)
        );
        const lon2 =
          lon1 +
          Math.atan2(
            Math.sin(bearing) * Math.sin(ang) * Math.cos(lat1),
            Math.cos(ang) - Math.sin(lat1) * Math.sin(lat2)
          );
        return [(lat2 * 180) / Math.PI, (lon2 * 180) / Math.PI];
      }

      function currentBearing() {
        if (!map || typeof map.getBearing !== "function") {
          return 0;
        }
        const bearing = Number(map.getBearing());
        return Number.isFinite(bearing) ? ((bearing % 360) + 360) % 360 : 0;
      }

      // leaflet-rotate's getBearing() is the pane rotation angle. Because of
      // screen Y-down + its rotation matrix, the geographic direction that
      // points to the top of the screen is the opposite of that angle.
      function screenUpBearing() {
        return (360 - currentBearing()) % 360;
      }

      function generateGrid(originLat, originLon, rowBearingDeg) {
        const countM = CONFIG.dim_m;
        const countE = CONFIG.dim_e;
        const spacingMeters = Number(CONFIG.spacing_m);
        const staggered = CONFIG.staggered !== false;
        const endless = !!CONFIG.endless;
        const rowBearing = Number.isFinite(rowBearingDeg)
          ? ((rowBearingDeg % 360) + 360) % 360
          : screenUpBearing();
        const colBearing = (rowBearing + 90) % 360;
        const points = [];

        // Row axis = screen-up; col axis = screen-right. Recompute against
        // screen-up (not raw getBearing) so the stencil stays fixed on screen
        // while tiles rotate underneath — using +getBearing over-compensates.
        const rowStart = endless ? -countM : 0;
        const rowEnd = endless ? countM : countM - 1;
        const colStart = endless ? -countE : 0;
        const colEnd = endless ? countE : countE - 1;

        for (let indexM = rowStart; indexM <= rowEnd; indexM++) {
          const stagger =
            staggered && rowIsOdd(indexM) ? spacingMeters / 2 : 0;
          for (let indexE = colStart; indexE <= colEnd; indexE++) {
            let [lat, lon] = destinationLatLng(
              originLat,
              originLon,
              rowBearing,
              indexM * spacingMeters
            );
            [lat, lon] = destinationLatLng(
              lat,
              lon,
              colBearing,
              indexE * spacingMeters + stagger
            );
            const isOrigin = indexM === 0 && indexE === 0;
            points.push({
              label: endless
                ? `R${indexM}C${indexE}`
                : `R${indexM + 1}C${indexE + 1}`,
              lat,
              lon,
              isOrigin,
            });
          }
        }

        return points;
      }

      function updateOriginReadout() {
        const readout = document.getElementById("origin-readout");
        const bearing = Math.round(screenUpBearing());
        if (CONFIG.endless) {
          readout.textContent = `endless ±${CONFIG.dim_m}x±${CONFIG.dim_e} · ${bearing}°`;
        } else {
          readout.textContent = `${CONFIG.dim_m}x${CONFIG.dim_e} grid · ${bearing}°`;
        }
      }

      // Marker pool: moving existing markers with setLatLng is far cheaper
      // than clearing and recreating the whole layer on every frame of a
      // drag/rotate gesture. Rebuilt only when the grid dimensions change
      // (labels and popups depend on row/column layout, not just count).
      let gridMarkers = [];
      let gridPoolKey = "";
      function drawGrid(originLat, originLon) {
        const points = generateGrid(originLat, originLon, screenUpBearing());
        const poolKey = `${CONFIG.endless ? "E" : "F"}:${CONFIG.dim_m}x${CONFIG.dim_e}:${CONFIG.staggered ? 1 : 0}`;
        if (poolKey === gridPoolKey && gridMarkers.length === points.length) {
          for (let i = 0; i < points.length; i++) {
            gridMarkers[i].setLatLng([points[i].lat, points[i].lon]);
          }
          return;
        }
        gridLayer.clearLayers();
        gridPoolKey = poolKey;
        gridMarkers = points.map((point) =>
          L.circleMarker([point.lat, point.lon], {
            radius: point.isOrigin ? 9 : 6,
            color: point.isOrigin ? "#00C853" : "#1E90FF",
            fillColor: point.isOrigin ? "#00C853" : "#1E90FF",
            fillOpacity: point.isOrigin ? 0.85 : 0.45,
            weight: 2,
          })
            .bindPopup(point.label)
            .addTo(gridLayer)
        );
      }

      function drawUserMarker() {
        userMarker.clearLayers();
        if (
          !Number.isFinite(CONFIG.user_lat) ||
          !Number.isFinite(CONFIG.user_lon)
        ) {
          return;
        }
        L.circleMarker([CONFIG.user_lat, CONFIG.user_lon], {
          radius: 7,
          color: "#FF0000",
          fillColor: "#FF0000",
          fillOpacity: 1.0,
          weight: 2,
        })
          .bindPopup("Your position")
          .addTo(userMarker);
      }

      // move/zoom/rotate events fire continuously during gestures (60+/s);
      // coalesce overlay redraws to one per animation frame so dragging and
      // two-finger rotating stay smooth even with large grids.
      let redrawScheduled = false;
      function onViewportChanged() {
        if (suppressEvents || redrawScheduled) {
          return;
        }
        redrawScheduled = true;
        requestAnimationFrame(() => {
          redrawScheduled = false;
          if (!map) {
            return;
          }
          const center = map.getCenter();
          drawGrid(center.lat, center.lng);
          updateOriginReadout();
        });
      }

      function applyView(centerLat, centerLon, zoom, orientationDeg) {
        if (!Number.isFinite(centerLat) || !Number.isFinite(centerLon)) {
          return;
        }
        suppressEvents = true;
        map.setView(
          [centerLat, centerLon],
          Number.isFinite(zoom) ? zoom : map.getZoom(),
          { animate: false }
        );
        if (
          Number.isFinite(orientationDeg) &&
          typeof map.setBearing === "function"
        ) {
          // orientationDeg is geographic screen-up; pane rotation is opposite.
          map.setBearing((360 - orientationDeg) % 360);
        }
        suppressEvents = false;
        drawGrid(centerLat, centerLon);
        updateOriginReadout();
      }

      function pushViewportToStreamlit() {
        if (suppressEvents || !map) {
          return;
        }
        const center = map.getCenter();
        sendToStreamlit("streamlit:setComponentValue", {
          dataType: "json",
          value: {
            lat: center.lat,
            lon: center.lng,
            zoom: map.getZoom(),
            // Geographic heading of the row axis (screen-up), not raw pane angle.
            bearing: screenUpBearing(),
            seq: lastViewSeq,
          },
        });
      }

      function applyUpdateGrid(data) {
        const prevM = CONFIG.dim_m;
        const prevE = CONFIG.dim_e;
        const prevSpacing = CONFIG.spacing_m;
        const prevStaggered = CONFIG.staggered;
        const prevEndless = CONFIG.endless;

        if (data.dim_m != null) CONFIG.dim_m = asCount(data.dim_m, 4);
        if (data.dim_e != null) CONFIG.dim_e = asCount(data.dim_e, 4);
        if (data.spacing_m != null) CONFIG.spacing_m = Number(data.spacing_m);
        if (data.staggered != null) CONFIG.staggered = !!data.staggered;
        if (data.endless != null) CONFIG.endless = !!data.endless;

        // Duplicate messages arrive from the sender's retries; skip no-op redraws.
        if (
          prevM === CONFIG.dim_m &&
          prevE === CONFIG.dim_e &&
          prevSpacing === CONFIG.spacing_m &&
          prevStaggered === CONFIG.staggered &&
          prevEndless === CONFIG.endless
        ) {
          return;
        }

        const center = map.getCenter();
        drawGrid(center.lat, center.lng);
        updateOriginReadout();
      }

      function handleMapMessage(data) {
        if (!data || data.type !== MAP_MESSAGE_TYPE || !map) {
          return;
        }

        if (data.action === "updateGrid") {
          applyUpdateGrid(data);
          return;
        }

        if (data.action === "setView") {
          const lat =
            data.lat != null ? Number(data.lat) : map.getCenter().lat;
          const lon =
            data.lon != null ? Number(data.lon) : map.getCenter().lng;
          const zoom = data.zoom != null ? Number(data.zoom) : map.getZoom();
          const bearing =
            data.bearing != null ? Number(data.bearing) : undefined;
          applyView(lat, lon, zoom, bearing);
          return;
        }

        if (data.action === "updateUser") {
          const nextLat = Number(data.user_lat);
          const nextLon = Number(data.user_lon);
          if (
            !Number.isFinite(nextLat) ||
            !Number.isFinite(nextLon) ||
            (nextLat === CONFIG.user_lat && nextLon === CONFIG.user_lon)
          ) {
            return;
          }
          CONFIG.user_lat = nextLat;
          CONFIG.user_lon = nextLon;
          drawUserMarker();
        }
      }

      function initMap(args) {
        // args.bearing is geographic row-axis (screen-up); pane angle is opposite.
        const orientation = Number(args.bearing);
        const initialBearing = Number.isFinite(orientation)
          ? (360 - orientation) % 360
          : 0;
        map = L.map("map", {
          center: [Number(args.center_lat), Number(args.center_lon)],
          zoom: Number(args.zoom) || 19,
          zoomControl: true,
          maxZoom: 25,
          rotate: true,
          bearing: initialBearing,
          touchRotate: true,
          shiftKeyRotate: true,
          // closeOnZeroBearing:false keeps the compass needle control visible
          // even when north-up so users can re-enable two-finger rotate.
          rotateControl: {
            closeOnZeroBearing: false,
            position: "topleft",
          },
        });

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
          maxZoom: 25,
          maxNativeZoom: 19,
        }).addTo(map);

        L.control
          .scale({
            position: "bottomright",
            metric: true,
            imperial: false,
            maxWidth: 120,
          })
          .addTo(map);

        gridLayer = L.layerGroup().addTo(map);
        userMarker = L.layerGroup().addTo(map);

        let viewportPushTimer = null;
        function scheduleViewportPush() {
          if (suppressEvents) {
            return;
          }
          // Debounce all origin reports so a pan/rotate gesture becomes one
          // Streamlit fragment rerun instead of a flood of them.
          clearTimeout(viewportPushTimer);
          viewportPushTimer = setTimeout(pushViewportToStreamlit, 400);
        }

        function onRotateChanged() {
          onViewportChanged();
          scheduleViewportPush();
        }

        map.on("move", onViewportChanged);
        map.on("zoom", onViewportChanged);
        map.on("rotate", onRotateChanged);
        map.on("moveend", scheduleViewportPush);
        map.on("zoomend", scheduleViewportPush);
        // rotateend is the reliable end-of-gesture signal; without it a
        // rotate-only twist can leave the last debounced push cancelled.
        map.on("rotateend", scheduleViewportPush);

        // The iframe is sized by Streamlit after the first render message,
        // so re-measure once the height settles to avoid a broken tile grid.
        setTimeout(() => map.invalidateSize(), 100);
      }

      function handleRender(args) {
        const height = Number(args.height) || 520;
        document.getElementById("map-shell").style.height = height + "px";
        sendToStreamlit("streamlit:setFrameHeight", { height: height });

        CONFIG.dim_m = asCount(args.dim_m, 4);
        CONFIG.dim_e = asCount(args.dim_e, 4);
        CONFIG.spacing_m = Number(args.spacing_m) || 2.0;
        CONFIG.staggered = args.staggered !== false;
        CONFIG.endless = !!args.endless;
        if (args.user_lat != null && args.user_lon != null) {
          CONFIG.user_lat = Number(args.user_lat);
          CONFIG.user_lon = Number(args.user_lon);
        }

        if (map === null) {
          initMap(args);
        }

        if (args.view_seq !== lastViewSeq) {
          lastViewSeq = args.view_seq;
          applyView(
            Number(args.center_lat),
            Number(args.center_lon),
            Number(args.zoom),
            Number(args.bearing)
          );
        } else {
          // Ordinary rerun: keep the user's current view, just refresh
          // the overlays in case grid dimensions changed.
          const center = map.getCenter();
          drawGrid(center.lat, center.lng);
          updateOriginReadout();
        }
        drawUserMarker();
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (data && data.type === "streamlit:render") {
          handleRender(data.args || {});
        }
      });

      // Live updates (user GPS marker, grid dims from the sidebar fragment)
      // arrive over BroadcastChannel between full reruns.
      try {
        if (typeof BroadcastChannel !== "undefined") {
          const gridChannel = new BroadcastChannel(MAP_MESSAGE_TYPE);
          gridChannel.onmessage = (event) => {
            handleMapMessage(event.data);
          };
        }
      } catch (error) {
        // Ignore channel errors on older browsers.
      }

      sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    </script>
  </body>
</html>
